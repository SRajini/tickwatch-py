<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tickwatch: live market monitor</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F4;--panel:#FFFFFF;--ink:#16212C;--mute:#66758A;--line:#D8DEE6;--up:#0B8A68;--dn:#C7432E;--acc:#2D5FD6;--sma2:#B9780E;--upbg:#E3F4EE;--dnbg:#FBE9E5;--sel:#E6ECFA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--panel:#17212C;--ink:#E5EBF2;--mute:#8A9AAE;--line:#263341;--up:#3CC49A;--dn:#F0735E;--acc:#7CA0FF;--sma2:#E6A93A;--upbg:#12332B;--dnbg:#3A1E1A;--sel:#1E2D45}}
:root[data-theme="dark"]{--bg:#0F1720;--panel:#17212C;--ink:#E5EBF2;--mute:#8A9AAE;--line:#263341;--up:#3CC49A;--dn:#F0735E;--acc:#7CA0FF;--sma2:#E6A93A;--upbg:#12332B;--dnbg:#3A1E1A;--sel:#1E2D45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:12px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:grid;grid-template-columns:310px 1fr;gap:16px;padding:16px 20px;max-width:1280px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h2{font-size:13px;font-weight:600;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.row:last-child{border-bottom:0}
.row.sel{background:var(--sel);border-left-color:var(--acc)}
.row b{font-weight:600}.row small{display:block;color:var(--mute);font-size:11px}
.px{text-align:right;font-weight:500}.px small{font-weight:500}
.up{color:var(--up)}.dn{color:var(--dn)}
.flashu{animation:fu 1.2s}.flashd{animation:fd 1.2s}
@keyframes fu{from{background:var(--upbg)}}@keyframes fd{from{background:var(--dnbg)}}
@media (prefers-reduced-motion:reduce){.flashu,.flashd{animation:none}}
.head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;padding:14px 16px 4px}
.head .big{font-size:30px;font-weight:600;letter-spacing:-.02em}
.head .name{font-size:16px;font-weight:600}
.head .st{color:var(--mute);font-size:12px}
.tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:4px 16px 8px;font-size:12px;color:var(--mute)}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
#chart{width:100%;height:340px;display:block}
.bottom{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px}
.feed{max-height:300px;overflow:auto}
.al{display:grid;grid-template-columns:62px 54px 1fr;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);border-left:3px solid var(--mute);font-size:13px}
.al.up{border-left-color:var(--up)}.al.dn{border-left-color:var(--dn)}.al.in{border-left-color:var(--acc)}
.al time{color:var(--mute);font-size:12px}.al span{color:var(--ink)}
.empty{padding:18px 14px;color:var(--mute)}
form{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
form input{width:96px}
.rule{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.rule button{padding:2px 8px;font-size:12px}
@media (max-width:860px){.app{grid-template-columns:1fr;padding:12px}.bottom{grid-template-columns:1fr}#chart{height:260px}}
</style></head>
<body>
<header>
 <div><h1>Tickwatch</h1><div class="sub" id="src">Loading quotes…</div></div>
 <div class="ctl">
  <label><input type="checkbox" id="snd"> Sound</label>
  <button id="pp">Pause</button>
  <button id="th">Theme</button>
 </div>
</header>
<div class="app">
 <section class="card" aria-label="Watchlist"><h2>Watchlist</h2><div id="wl"></div></section>
 <main>
  <section class="card">
   <div class="head" id="hd"></div>
   <div class="tools">
    <span class="lg"><i style="background:var(--acc)"></i>Price</span>
    <span class="lg"><i style="background:var(--sma2)"></i>10-tick average</span>
    <span class="lg"><i style="background:var(--mute)"></i>30-tick average</span>
    <span style="margin-left:auto">Window <select id="rg"><option value="60">60 ticks</option><option value="120" selected>120 ticks</option><option value="300">300 ticks</option></select></span>
   </div>
   <canvas id="chart" role="img" aria-label="Price chart with moving averages"></canvas>
  </section>
  <div class="bottom">
   <section class="card"><h2>Alert feed <button id="clr">Clear</button></h2><div class="feed" id="feed"></div></section>
   <section class="card"><h2>Your price alerts</h2>
    <form id="fm"><select id="rs" aria-label="Symbol"></select>
     <select id="rd" aria-label="Direction"><option value="above">rises above</option><option value="below">falls below</option></select>
     <input id="rp" type="number" step="0.01" min="0" aria-label="Price" required><button>Add alert</button></form>
    <div id="rules"></div>
   </section>
  </div>
  <p class="sub" style="padding:0 4px">Automatic alerts: 10/30 average crossovers, moves of 1.5% or more over 30 ticks, and new highs or lows since the session started.</p>
 </main>
</div>
<script>
const $=id=>document.getElementById(id);
const rand=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
let S=[];
let sel=0,range=120,paused=false,timer=null,tickN=0,hover=-1,rules=[],feed=[],rid=0,live=false;
const fmt=n=>n.toFixed(2),pct=n=>(n>=0?"+":"")+n.toFixed(2)+"%";
const sma=(a,n)=>a.map((_,i)=>{if(i<n-1)return NaN;let t=0;for(let k=i-n+1;k<=i;k++)t+=a[k];return t/n});
const smaEnd=(a,n,off=0)=>{const e=a.length-off;if(e<n)return NaN;let t=0;for(let k=e-n;k<e;k++)t+=a[k];return t/n};

function alert_(st,kind,msg){
 if(!live)return;
 feed.unshift({t:new Date(),s:st.s,kind,msg});feed.length=Math.min(feed.length,60);
 st.flash=kind;renderFeed();
 if($("snd").checked)beep(kind);
}
let ac;function beep(k){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=k==="up"?880:k==="dn"?440:660;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.12)}catch(e){}}
function cool(st,k,n){if(tickN-(st.cd[k]??-999)<n)return false;st.cd[k]=tickN;return true}

function step(st,px){
 st.drift=st.drift*.985+rand()*st.v*.35;
 const prev=st.p;st.p=px>0?px:Math.max(1,st.p*(1+st.drift+rand()*st.v));
 st.dir=st.p>=prev?1:-1;
 const h=st.hist;h.push(st.p);if(h.length>420)h.shift();
 if(live){
  if(st.p>st.hi&&cool(st,"hi",60))alert_(st,"up","New session high at "+fmt(st.p));
  if(st.p<st.lo&&cool(st,"lo",60))alert_(st,"dn","New session low at "+fmt(st.p));
 }
 st.hi=Math.max(st.hi,st.p);st.lo=Math.min(st.lo,st.p);
 if(!live)return;
 const a=smaEnd(h,10),b=smaEnd(h,30),a0=smaEnd(h,10,1),b0=smaEnd(h,30,1);
 if(a0<=b0&&a>b&&cool(st,"x",25))alert_(st,"up","Bullish crossover: 10-tick average moved above the 30-tick average at "+fmt(st.p));
 if(a0>=b0&&a<b&&cool(st,"x",25))alert_(st,"dn","Bearish crossover: 10-tick average fell below the 30-tick average at "+fmt(st.p));
 const ref=h[h.length-31];
 if(ref){const m=(st.p/ref-1)*100;
  if(m>=1.5&&cool(st,"m",40))alert_(st,"up","Surge: "+pct(m)+" over the last 30 ticks");
  if(m<=-1.5&&cool(st,"m",40))alert_(st,"dn","Drop: "+pct(m)+" over the last 30 ticks");}
 rules=rules.filter(r=>{if(r.s!==st.s)return true;
  const hit=r.d==="above"?st.p>=r.v:st.p<=r.v;
  if(hit){alert_(st,r.d==="above"?"up":"dn","Your alert fired: "+st.s+" "+(r.d==="above"?"rose above ":"fell below ")+fmt(r.v)+" (now "+fmt(st.p)+")");renderRules();return false}
  return true});
}

function renderWL(){
 const el=$("wl");
 el.innerHTML=S.map((st,i)=>{
  const c=(st.p/st.open-1)*100,h=st.hist.slice(-60),mn=Math.min(...h),mx=Math.max(...h),rg=mx-mn||1;
  const pts=h.map((v,k)=>(k/(h.length-1||1)*64).toFixed(1)+","+(22-(v-mn)/rg*20).toFixed(1)).join(" ");
  const f=st.flash?(st.flash==="dn"?"flashd":"flashu"):"";st.flash=null;
  return `<div class="row ${i===sel?"sel":""} ${f}" data-i="${i}" tabindex="0" role="button" aria-label="${st.s} ${fmt(st.p)}">
   <div><b>${st.s}</b><small>${st.n}</small></div>
   <div class="px ${c>=0?"up":"dn"}">${fmt(st.p)}<small>${pct(c)}</small></div>
   <svg width="64" height="24" viewBox="0 0 64 24" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c>=0?"var(--up)":"var(--dn)"}" stroke-width="1.5"/></svg></div>`}).join("");
}
function renderHead(){
 const st=S[sel],c=(st.p/st.open-1)*100;
 $("hd").innerHTML=`<span class="name">${st.s} <span class="st">${st.n}</span></span><span class="big">${fmt(st.p)}</span>
 <span class="${c>=0?"up":"dn"}">${pct(c)} since open</span><span class="st">Session high ${fmt(st.hi)}, low ${fmt(st.lo)}</span>`;
}
function renderFeed(){
 $("feed").innerHTML=feed.length?feed.map(f=>`<div class="al ${f.kind}"><time>${f.t.toLocaleTimeString([], {hour12:false})}</time><b>${f.s}</b><span>${f.msg}</span></div>`).join(""):'<div class="empty">No alerts yet. Crossovers, sharp moves and new highs or lows will appear here.</div>';
}
function renderRules(){
 saveRules();
 $("rules").innerHTML=rules.length?rules.map(r=>`<div class="rule"><span><b>${r.s}</b> ${r.d==="above"?"rises above":"falls below"} ${fmt(r.v)}</span><button data-r="${r.id}" aria-label="Remove alert">Remove</button></div>`).join(""):'<div class="empty">Set a price level and you will be alerted when it is crossed.</div>';
 draw();
}

function draw(){
 if(!S.length)return;
 const c=$("chart"),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 if(c.width!==Math.round(r.width*dpr)){c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr)}
 const x=c.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,r.width,r.height);
 const cs=getComputedStyle(document.documentElement),V=k=>cs.getPropertyValue(k).trim();
 const st=S[sel],n=Math.min(range,st.hist.length),h=st.hist.slice(-n);
 const s1=sma(st.hist,10).slice(-n),s2=sma(st.hist,30).slice(-n);
 const W=r.width,H=r.height,pl=10,pr=58,pt=10,pb=24,cw=W-pl-pr,ch=H-pt-pb;
 let mn=Math.min(...h),mx=Math.max(...h);const pad=(mx-mn)*.1||1;mn-=pad;mx+=pad;
 const X=i=>pl+cw*i/(range-1)+cw*(range-n)/(range-1),Y=v=>pt+ch*(1-(v-mn)/(mx-mn));
 x.font='11px "IBM Plex Sans",system-ui,sans-serif';x.textBaseline="middle";
 x.strokeStyle=V("--line");x.fillStyle=V("--mute");x.lineWidth=1;
 for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();x.textAlign="left";x.fillText(fmt(v),W-pr+6,y)}
 x.textBaseline="top";x.textAlign="left";x.fillText("-"+(n-1)+" ticks",pl,H-pb+6);x.textAlign="right";x.fillText("now",W-pr,H-pb+6);
 const line=(a,col,w)=>{x.beginPath();let on=false;a.forEach((v,i)=>{if(isNaN(v)){return}on?x.lineTo(X(i),Y(v)):(x.moveTo(X(i),Y(v)),on=true)});x.strokeStyle=col;x.lineWidth=w;x.lineJoin="round";x.stroke()};
 // area
 const g=x.createLinearGradient(0,pt,0,pt+ch);g.addColorStop(0,V("--acc")+"33");g.addColorStop(1,V("--acc")+"00");
 x.beginPath();h.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.lineTo(X(n-1),pt+ch);x.lineTo(X(0),pt+ch);x.closePath();x.fillStyle=g;x.fill();
 line(s2,V("--mute"),1.5);line(s1,V("--sma2"),1.5);line(h,V("--acc"),2);
 // user alert levels
 x.setLineDash([5,4]);rules.filter(q=>q.s===st.s&&q.v>mn&&q.v<mx).forEach(q=>{const y=Y(q.v);x.strokeStyle=q.d==="above"?V("--up"):V("--dn");x.lineWidth=1.2;x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();x.fillStyle=x.strokeStyle;x.textBaseline="bottom";x.textAlign="left";x.fillText("alert "+fmt(q.v),pl+4,y-2)});x.setLineDash([]);
 // last price tag
 const ly=Y(st.p);x.fillStyle=V("--acc");x.fillRect(W-pr+2,ly-9,pr-4,18);x.fillStyle="#fff";x.textAlign="left";x.textBaseline="middle";x.fillText(fmt(st.p),W-pr+6,ly);
 // hover
 if(hover>=0&&hover<n){const hx=X(hover);x.strokeStyle=V("--mute");x.lineWidth=1;x.beginPath();x.moveTo(hx,pt);x.lineTo(hx,pt+ch);x.stroke();
  const t="Price "+fmt(h[hover])+(isNaN(s1[hover])?"":"   10-avg "+fmt(s1[hover]))+(isNaN(s2[hover])?"":"   30-avg "+fmt(s2[hover]));
  x.textAlign="left";x.textBaseline="top";x.fillStyle=V("--panel");x.fillRect(pl+2,pt+2,x.measureText(t).width+12,20);x.fillStyle=V("--ink");x.fillText(t,pl+8,pt+7)}
}

function saveRules(){try{localStorage.setItem("tw-rules",JSON.stringify(rules))}catch(e){}}
function loadRules(){try{const r=JSON.parse(localStorage.getItem("tw-rules")||"[]");if(Array.isArray(r))return r.filter(x=>x&&x.s&&x.v>0&&(x.d==="above"||x.d==="below"))}catch(e){}return[]}
const hashOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%997;return h};
function build(symbols,opens,prices,sim){
 S=symbols.map(s=>{const h=hashOf(s),p=sim?20+h%380:prices[s],v=.0008+(h%10)*.0001;
  return{s,n:"",p,v,open:(opens&&opens[s]>0)?opens[s]:p,hist:[p],drift:0,hi:p,lo:p,cd:{},dir:0}});
}
const paint=()=>{renderWL();renderHead();draw()};
async function getQuotes(){const r=await fetch("/api/quotes",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
const syncPrice=()=>{const q=S.find(s=>s.s===$("rs").value);if(q)$("rp").value=fmt(q.p)};

async function main(){
 let cfg;
 try{cfg=await getQuotes()}catch(e){$("src").textContent="Could not reach /api/quotes ("+e.message+"). Deploy to Vercel or run 'vercel dev'.";return}
 rules=loadRules();rules.forEach(r=>{r.id=r.id||++rid;rid=Math.max(rid,r.id)});
 if(cfg.mode==="simulated"){
  build(cfg.symbols,null,null,true);
  for(let i=0;i<340;i++){S.forEach(st=>step(st));tickN++}
  S.forEach(s=>{s.open=s.hist[0];s.hi=Math.max(...s.hist);s.lo=Math.min(...s.hist)});
  $("src").textContent="Simulated feed: no API key is set on the server, so prices are generated in your browser. Not real quotes.";
  live=true;
  setInterval(()=>{if(!paused){S.forEach(st=>step(st));tickN++;paint()}},1000);
 }else{
  build(cfg.symbols.filter(s=>cfg.prices[s]>0),cfg.opens,cfg.prices,false);
  $("src").textContent="Live quotes from Finnhub, refreshed every "+(cfg.pollMs/1000)+"s. Each tick is one refresh; the chart fills in while this tab is open.";
  live=true;let last=cfg.ts;
  setInterval(async()=>{
   if(paused)return;
   try{const q=await getQuotes();if(!q.prices||q.ts===last)return;last=q.ts;tickN++;
    S.forEach(st=>{const px=q.prices[st.s];if(px>0)step(st,px)});paint()}catch(e){}
  },cfg.pollMs||10000);
 }
 sel=0;$("rs").innerHTML=S.map(s=>`<option>${s.s}</option>`).join("");syncPrice();
 renderRules();renderFeed();paint();
}
$("rs").onchange=syncPrice;
$("fm").onsubmit=e=>{e.preventDefault();const v=parseFloat($("rp").value);if(!(v>0))return;rules.push({id:++rid,s:$("rs").value,d:$("rd").value,v});renderRules()};
$("rules").onclick=e=>{const id=e.target.dataset.r;if(id){rules=rules.filter(r=>r.id!=id);renderRules()}};
const pick=e=>{const r=e.target.closest(".row");if(r){sel=+r.dataset.i;$("rs").value=S[sel].s;syncPrice();paint()}};
$("wl").onclick=pick;$("wl").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(e)}};
$("rg").onchange=e=>{range=+e.target.value;draw()};
$("pp").onclick=e=>{paused=!paused;e.target.textContent=paused?"Resume":"Pause";if(!paused&&S.length)paint()};
$("clr").onclick=()=>{feed=[];renderFeed()};
$("th").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark";draw()};
const cv=$("chart");
cv.onmousemove=e=>{if(!S.length)return;const r=cv.getBoundingClientRect(),n=Math.min(range,S[sel].hist.length),cw=r.width-68,f=(e.clientX-r.left-10)/cw*(range-1)-(range-n);hover=Math.round(f);draw()};
cv.onmouseleave=()=>{hover=-1;draw()};
addEventListener("resize",draw);
main();
</script></body></html>
