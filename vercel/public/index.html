header{

}

}

  gap:16px;

}

.card{

  border-radius:10px;
  overflow:hidden
}

}

.row{

  padding:10px 14px;

  cursor:pointer;
  border-left:3px solid transparent
}

.row:last-child{
  border-bottom:0
}

.row.sel{
  background:var(--sel);
  border-left-color:var(--acc)
}

.row b{
  font-weight:600
}

.row small{
  display:block;

  font-size:11px
}

.px{

}

.px small{
  font-weight:500
}

.up{

}

.dn{
  color:var(--dn)
}

.flashu{
  animation:fu 1.2s
}

.flashd{
  animation:fd 1.2s
}

@keyframes fu{
  from{
    background:var(--upbg)
  }
}

@keyframes fd{
  from{
    background:var(--dnbg)
  }
}

@media (prefers-reduced-motion:reduce){
  .flashu,
  .flashd{
    animation:none
  }
}

.feed{

.al.up{

.al.dn{

.al.in{

.al time{

.al span{

.empty{

form{

    grid-template-columns:1fr
  }

    height:260px
  }
}
